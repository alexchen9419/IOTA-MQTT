# mqtt/config/acl.conf
# Eclipse Mosquitto ACL（存取控制清單）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 規則說明:
#   topic read  <pattern>  — 允許訂閱
#   topic write <pattern>  — 允許發布
#   topic readwrite <pattern> — 允許訂閱與發布
#
# Wildcards: + 單層，# 多層（MQTT 標準）

# ── admin：完整存取（Grafana MQTT Plugin、管理用） ──
user admin
topic readwrite #

# ── bridge：IOTA-MQTT Bridge 服務帳號 ──────────────
# 需要訂閱設備狀態、發布 tx_digest 回傳、以及 IOTA 事件
user bridge
topic read  home/#
topic write home/#
topic read  $SYS/#

# ── iot：IoT 設備帳號（受限制）─────────────────────
# 設備只能:
#   1. 發布自身狀態到 home/devices/{device_id}/state
#   2. 接收自身 tx_digest 回傳
#   3. 接收下發指令
user iot
topic write home/devices/+/state
topic read  home/devices/+/tx_digest
topic read  home/devices/+/command

# ── nodered：Node-RED 服務帳號 ─────────────────────
# Node-RED 需要完整的 home/# 存取權（接收設備狀態 + 下發指令）
user nodered
topic readwrite home/#
topic read  $SYS/#

# ── 廣播主題（任何已驗證使用者皆可訂閱） ─────────────
# 家庭自動化事件廣播
pattern read home/broadcast/#
pattern read home/iota/events
